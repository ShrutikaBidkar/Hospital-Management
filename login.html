<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System - Login</title>

    <link rel="stylesheet"
        href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Hospital Management System</h1>

            <h2 id="roleTitle">
                Login
            </h2>

            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-btn">
                    Login

                </button>
            </form>


            <p id="message"></p>


            <button
                type="button"
                class="change-role-btn"
                onclick="changeRole()">

                Change Role

            </button>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
